<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCスタッフ向け 動的タイムデザイン管理</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --ink:#1c2230;
    --sub:#697086;
    --line:#e3e6ec;
    --blue:#3d7bf5;
    --green:#1fae7a;
    --amber:#f0a63a;
    --pink:#ec5f8f;
    --grey:#e5e8ee;
    --danger:#e05353;
    --ok-bg:#e6f7ef;
    --ok-fg:#1c8a5c;
    --ng-bg:#fdecec;
    --ng-fg:#c23a3a;
    --radius:14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161c; --card:#1d2028; --ink:#eef0f4; --sub:#9aa0b2; --line:#2b2f3a; --grey:#2b2f3a;
      --ok-bg:#123326; --ok-fg:#5fd6a5; --ng-bg:#3a1c1c; --ng-fg:#f19a9a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161c; --card:#1d2028; --ink:#eef0f4; --sub:#9aa0b2; --line:#2b2f3a; --grey:#2b2f3a;
    --ok-bg:#123326; --ok-fg:#5fd6a5; --ng-bg:#3a1c1c; --ng-fg:#f19a9a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px; margin:0 auto; padding:32px 20px 64px;}
  header h1{font-size:22px; font-weight:700; margin:0 0 4px;}
  header p{color:var(--sub); font-size:13.5px; margin:0 0 28px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 24px; margin-bottom:18px;
  }
  h2{font-size:15px; font-weight:700; margin:0 0 18px;}
  .row{display:flex; gap:16px; flex-wrap:wrap;}
  .field{flex:1 1 220px; min-width:160px;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:6px;}
  .field .unit-wrap{display:flex; align-items:center; gap:8px;}
  input[type=number], select{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:15px; font-family:inherit;
  }
  input[type=number]:focus, select:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .unit{color:var(--sub); font-size:13px; white-space:nowrap;}
  button{font-family:inherit; cursor:pointer; border:none;}
  .btn-primary{
    width:100%; margin-top:16px; padding:13px; border-radius:10px;
    background:var(--blue); color:#fff; font-size:14.5px; font-weight:700;
  }
  .btn-primary:active{opacity:.85;}
  .status-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
  @media (max-width:720px){.status-grid{grid-template-columns:1fr;}}
  .stat-label{font-size:12.5px; color:var(--sub); margin-bottom:10px;}
  .stat-big{font-size:30px; font-weight:800; margin-bottom:6px;}
  .stat-sub{font-size:12px; color:var(--sub); margin-bottom:10px;}
  .badge{display:inline-block; font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px;}
  .badge.ok{background:var(--ok-bg); color:var(--ok-fg);}
  .badge.ng{background:var(--ng-bg); color:var(--ng-fg);}
  .float-track{height:8px; background:var(--grey); border-radius:6px; overflow:hidden; margin-top:8px;}
  .float-fill{height:100%; background:var(--blue); border-radius:6px; transition:width .35s ease;}
  .ctrl-btn{
    width:100%; padding:12px; border-radius:10px; font-size:13.5px; font-weight:700;
    color:#fff; margin-bottom:10px; text-align:center; transition:transform .12s ease;
  }
  .ctrl-btn:active{transform:scale(.98);}
  .ctrl-btn.warn{background:var(--amber);}
  .ctrl-btn.danger{background:var(--danger);}
  .ctrl-btn.reset{background:var(--grey); color:var(--ink);}
  .timeline-bar{
    display:flex; height:34px; border-radius:8px; overflow:hidden; background:var(--grey);
  }
  .timeline-bar > div{height:100%; transition:width .35s ease;}
  .timeline-labels{display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-top:8px;}
  .modules{display:flex; flex-direction:column; gap:12px;}
  .module{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border:1px solid var(--line); border-radius:12px; padding:14px 16px;
  }
  .module .idx{font-size:12px; color:var(--sub); width:26px; flex-shrink:0;}
  .module .name{font-size:14.5px; font-weight:600; margin-bottom:6px;}
  .tag{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:6px; margin-right:6px;}
  .tag.fixed{background:#e8effe; color:var(--blue);}
  .tag.variable{background:#fdf1de; color:#b5791f;}
  .tag.trim{background:#fdecec; color:var(--danger); font-weight:700;}
  .tag.add{background:#e6f7ef; color:var(--ok-fg); font-weight:700;}
  .mod-min{font-size:17px; font-weight:800; white-space:nowrap;}
  .mod-min span{font-size:12px; font-weight:500; color:var(--sub);}
  .mleft{display:flex; align-items:flex-start; gap:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MCスタッフ向け 動的タイムデザイン管理</h1>
    <p>MUST制約（制限時間）の厳守と、フロート（余裕）の有無を切り替えるリアルタイム管理モデル</p>
  </header>

  <div class="card">
    <h2>1. タイムライン基本設定</h2>
    <div class="row">
      <div class="field">
        <label for="totalMin">制限時間（MUST総枠）</label>
        <div class="unit-wrap">
          <input type="number" id="totalMin" value="90" min="10" step="5">
          <span class="unit">分</span>
        </div>
      </div>
      <div class="field">
        <label for="modeSel">設計モード選択</label>
        <select id="modeSel">
          <option value="float">フロートあり（バッファ重視・予備枠確保）</option>
          <option value="nofloat">フロートなし（枠内消化重視）</option>
        </select>
      </div>
    </div>
    <button class="btn-primary" id="buildBtn">タイムラインを構築・初期化</button>
  </div>

  <div class="status-grid">
    <div class="card">
      <div class="stat-label">総時間ステータス</div>
      <div class="stat-big" id="totalBig">90分</div>
      <div class="stat-sub" id="totalSub">制限MUST: 90分（遅延発生累計: 0分）</div>
      <span class="badge ok" id="statusBadge">制約クリア (OK)</span>
    </div>
    <div class="card">
      <div class="stat-label">フロート（バッファ）残量</div>
      <div class="stat-big" id="floatBig" style="color:var(--blue)">10分</div>
      <div class="stat-sub">質問や遅延を吸収する余裕枠</div>
      <div class="float-track"><div class="float-fill" id="floatFill" style="width:100%"></div></div>
    </div>
    <div class="card">
      <div class="stat-label">現場コントロール</div>
      <button class="ctrl-btn warn" id="delay5">⚠ ワークで+5分 押した！</button>
      <button class="ctrl-btn danger" id="delay10">⏱ +10分 大幅遅延！</button>
      <button class="ctrl-btn reset" id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="card">
    <h2>3. タイムライン可視化</h2>
    <div class="timeline-bar" id="timelineBar"></div>
    <div class="timeline-labels"><span>開始</span><span id="timelineMid">90分</span><span>終了</span></div>
  </div>

  <div class="card">
    <h2>4. モジュールタイムライン構造</h2>
    <div class="modules" id="moduleList"></div>
  </div>
</div>

<script>
(function(){
  var COLORS = ['#3d7bf5','#1fae7a','#f0a63a','#ec5f8f','#8c6fe0','#33b7c4'];
  var BASE_MODULES = [
    {name:'オープニング・趣旨説明', fixed:true, weight:10},
    {name:'講義セッション（基礎理論）', fixed:true, weight:30},
    {name:'グループワーク＆ディスカッション', fixed:false, weight:30},
    {name:'全体共有・質疑応答', fixed:false, weight:10}
  ];
  var MIN_VARIABLE = 5;

  var state = null; // {total, floatMode, floatMin, floatInit, modules:[{name,fixed,min}], delayAccum}

  var totalMinEl = document.getElementById('totalMin');
  var modeSelEl = document.getElementById('modeSel');

  function buildState(){
    var total = Math.max(10, parseInt(totalMinEl.value,10) || 90);
    var floatMode = modeSelEl.value === 'float';
    var floatMin = floatMode ? Math.round(total * (10/90)) : 0;
    var contentTotal = total - floatMin;
    var weightSum = BASE_MODULES.reduce(function(s,m){return s+m.weight;},0);
    var modules = BASE_MODULES.map(function(m){
      return {
        name:m.name,
        fixed:m.fixed,
        min: Math.max(m.fixed?1:MIN_VARIABLE, Math.round(contentTotal * (m.weight/weightSum)))
      };
    });
    state = {
      total: total,
      floatMode: floatMode,
      floatMin: floatMin,
      floatInit: floatMin,
      modules: modules,
      modulesInit: JSON.parse(JSON.stringify(modules)),
      delayAccum: 0
    };
  }

  function applyDelay(mins){
    if(!state) return;
    state.delayAccum += mins;
    var remaining = mins;
    var fromFloat = Math.min(state.floatMin, remaining);
    state.floatMin -= fromFloat;
    remaining -= fromFloat;
    if(remaining > 0){
      // trim variable modules proportionally, not below MIN_VARIABLE
      var variable = state.modules.filter(function(m){return !m.fixed;});
      var trimmable = variable.reduce(function(s,m){return s + Math.max(0, m.min - MIN_VARIABLE);},0);
      var toTrim = Math.min(remaining, trimmable);
      if(toTrim > 0 && trimmable > 0){
        variable.forEach(function(m){
          var share = (Math.max(0,m.min-MIN_VARIABLE)/trimmable) * toTrim;
          m.min = Math.max(MIN_VARIABLE, m.min - Math.round(share));
        });
      }
    }
    render();
  }

  function resetState(){
    if(!state) return;
    state.floatMin = state.floatInit;
    state.delayAccum = 0;
    state.modules = JSON.parse(JSON.stringify(state.modulesInit));
    render();
  }

  function render(){
    if(!state) return;
    var totalBig = document.getElementById('totalBig');
    var totalSub = document.getElementById('totalSub');
    var statusBadge = document.getElementById('statusBadge');
    var floatBig = document.getElementById('floatBig');
    var floatFill = document.getElementById('floatFill');
    var timelineBar = document.getElementById('timelineBar');
    var timelineMid = document.getElementById('timelineMid');
    var moduleList = document.getElementById('moduleList');

    totalBig.textContent = state.total + '分';
    totalSub.textContent = '制限MUST: ' + state.total + '分（遅延発生累計: ' + state.delayAccum + '分）';

    var variable = state.modules.filter(function(m){return !m.fixed;});
    var overLimit = variable.some(function(m){return m.min <= MIN_VARIABLE && state.delayAccum > 0 && state.floatMin === 0;});
    var atFloor = state.floatMin === 0 && variable.every(function(m){return m.min <= MIN_VARIABLE;}) && state.delayAccum > 0;
    if(atFloor){
      statusBadge.textContent = '制約超過 (要調整)';
      statusBadge.className = 'badge ng';
    } else {
      statusBadge.textContent = '制約クリア (OK)';
      statusBadge.className = 'badge ok';
    }

    floatBig.textContent = state.floatMin + '分';
    var pct = state.floatInit > 0 ? Math.max(0, Math.round(100*state.floatMin/state.floatInit)) : 0;
    floatFill.style.width = pct + '%';
    floatFill.style.background = pct < 30 ? 'var(--danger)' : 'var(--blue)';

    // timeline bar
    timelineBar.innerHTML = '';
    state.modules.forEach(function(m, i){
      var seg = document.createElement('div');
      seg.style.width = (100 * m.min / state.total) + '%';
      seg.style.background = COLORS[i % COLORS.length];
      timelineBar.appendChild(seg);
    });
    if(state.floatMin > 0){
      var fseg = document.createElement('div');
      fseg.style.width = (100 * state.floatMin / state.total) + '%';
      fseg.style.background = 'var(--grey)';
      timelineBar.appendChild(fseg);
    }
    timelineMid.textContent = state.total + '分';

    // module list
    moduleList.innerHTML = '';
    state.modules.forEach(function(m, i){
      var initMin = state.modulesInit[i].min;
      var div = document.createElement('div');
      div.className = 'module';
      var tagsHtml = m.fixed
        ? '<span class="tag fixed">固定（MUST）</span>'
        : '<span class="tag variable">可変（トリミング対象）</span>' +
          (m.min < initMin ? '<span class="tag trim">-' + (initMin-m.min) + '</span>' : '') +
          (m.min > initMin ? '<span class="tag add">+' + (m.min-initMin) + '</span>' : '');
      div.innerHTML =
        '<div class="mleft">' +
          '<div class="idx">#' + (i+1) + '</div>' +
          '<div><div class="name">' + m.name + '</div>' + tagsHtml + '</div>' +
        '</div>' +
        '<div class="mod-min">' + m.min + ' <span>分</span></div>';
      moduleList.appendChild(div);
    });
  }

  document.getElementById('buildBtn').addEventListener('click', function(){
    buildState();
    render();
  });
  document.getElementById('delay5').addEventListener('click', function(){ applyDelay(5); });
  document.getElementById('delay10').addEventListener('click', function(){ applyDelay(10); });
  document.getElementById('resetBtn').addEventListener('click', resetState);

  buildState();
  render();
})();
</script>
</body>
</html>
